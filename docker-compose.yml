services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: aperilex
      POSTGRES_USER: aperilex
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperilex"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - postgres_password

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aperilex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev_password}
      RABBITMQ_LOAD_DEFINITIONS: /etc/rabbitmq/definitions.json
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Messaging System (New)
      ENVIRONMENT: development
      MESSAGING_ENVIRONMENT: development
      WORKER_SERVICE_TYPE: docker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-aperilex}:${RABBITMQ_PASSWORD:-dev_password}@rabbitmq:5672/

      # Secrets runtime
      DOCKER_SECRETS_DIR: /run/secrets
      POSTGRES_PASSWORD_SECRET_NAME: postgres_password
      GOOGLE_CLIENT_ID_SECRET_NAME: GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET_NAME: GOOGLE_CLIENT_SECRET
      JWT_PRIVATE_KEY_SECRET_NAME: JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY_SECRET_NAME: JWT_PUBLIC_KEY
      OPENAI_API_KEY_SECRET_NAME: openai_api_key
      GOOGLE_API_KEY_SECRET_NAME: google_api_key

      # Application
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-characters}
      APERILEX_AUTHENTICATION_PROVIDER: ${APERILEX_AUTHENTICATION_PROVIDER:-MOCK}
      DEBUG: "true"
      EDGAR_IDENTITY: ${EDGAR_IDENTITY:-dev@aperilex.com}
      EDGAR_DATA_DIR: /tmp/edgar_data
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/data/storage}

      # LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy_openai_key}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-dummy_google_key}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./data:/app/data
    command: ["app"]
    secrets:
      - postgres_password
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - JWT_PRIVATE_KEY
      - JWT_PUBLIC_KEY
      - openai_api_key
      - google_api_key

  worker:
    build: .
    env_file: .env
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      ENVIRONMENT: development
      MESSAGING_ENVIRONMENT: development
      WORKER_SERVICE_TYPE: docker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-aperilex}:${RABBITMQ_PASSWORD:-dev_password}@rabbitmq:5672/
      DOCKER_SECRETS_DIR: /run/secrets
      POSTGRES_PASSWORD_SECRET_NAME: postgres_password
      GOOGLE_CLIENT_ID_SECRET_NAME: GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET_NAME: GOOGLE_CLIENT_SECRET
      JWT_PRIVATE_KEY_SECRET_NAME: JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY_SECRET_NAME: JWT_PUBLIC_KEY
      OPENAI_API_KEY_SECRET_NAME: openai_api_key
      GOOGLE_API_KEY_SECRET_NAME: google_api_key
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-characters}
      APERILEX_AUTHENTICATION_PROVIDER: ${APERILEX_AUTHENTICATION_PROVIDER:-MOCK}
      DEBUG: "true"
      EDGAR_IDENTITY: ${EDGAR_IDENTITY:-dev@aperilex.com}
      EDGAR_DATA_DIR: /tmp/edgar_data
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/data/storage}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy_openai_key}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-dummy_google_key}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./data:/app/data
    command: ["worker"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import asyncio; import aio_pika; asyncio.run(aio_pika.connect('amqp://${RABBITMQ_USER:-aperilex}:${RABBITMQ_PASSWORD:-dev_password}@rabbitmq:5672/')); print('RabbitMQ connection successful')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    secrets:
      - postgres_password
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - JWT_PRIVATE_KEY
      - JWT_PUBLIC_KEY
      - openai_api_key
      - google_api_key

volumes:
  postgres_data:
  rabbitmq_data:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  GOOGLE_CLIENT_ID:
    file: ./.secrets/GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET:
    file: ./.secrets/GOOGLE_CLIENT_SECRET
  JWT_PRIVATE_KEY:
    file: ./.secrets/JWT_PRIVATE_KEY
  JWT_PUBLIC_KEY:
    file: ./.secrets/JWT_PUBLIC_KEY
  openai_api_key:
    file: ./.secrets/openai_api_key
  google_api_key:
    file: ./.secrets/google_api_key
